<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" fill="none">
  <!-- Surgical Navigation & Calibration Corner Grid -->
  <!-- Axis Lines & Millimeter Calibration Ticks -->
  <g stroke="#09707D" stroke-width="1.2">
    <!-- Corner L-Axes -->
    <path d="M0 150 L0 0 L150 0" opacity="0.25"/>

    <!-- Ticks along Horizontal Axis -->
    <line x1="25" y1="0" x2="25" y2="6" opacity="0.25"/>
    <line x1="50" y1="0" x2="50" y2="8" opacity="0.30"/>
    <line x1="75" y1="0" x2="75" y2="6" opacity="0.25"/>
    <line x1="100" y1="0" x2="100" y2="8" opacity="0.30"/>
    <line x1="125" y1="0" x2="125" y2="6" opacity="0.25"/>
    <line x1="150" y1="0" x2="150" y2="8" opacity="0.30"/>

    <!-- Ticks along Vertical Axis -->
    <line x1="0" y1="25" x2="6" y2="25" opacity="0.25"/>
    <line x1="0" y1="50" x2="8" y2="50" opacity="0.30"/>
    <line x1="0" y1="75" x2="6" y2="75" opacity="0.25"/>
    <line x1="0" y1="100" x2="8" y2="100" opacity="0.30"/>
    <line x1="0" y1="125" x2="6" y2="125" opacity="0.25"/>
    <line x1="0" y1="150" x2="8" y2="150" opacity="0.30"/>

    <!-- 45-degree Guide Line -->
    <line x1="0" y1="0" x2="140" y2="140" stroke-dasharray="2 3" opacity="0.15"/>
  </g>

  <!-- Precision Crosshair Markers -->
  <g stroke="#09707D" stroke-width="1.3" stroke-linecap="round">
    <path d="M50 44V56M44 50H56" opacity="0.28"/>
    <path d="M100 44V56M94 50H106" opacity="0.20"/>
    <path d="M50 94V106M44 100H56" opacity="0.20"/>
    <path d="M100 94V106M94 100H106" opacity="0.15"/>
    <path d="M140 44V56M134 50H146" opacity="0.12"/>
    <path d="M50 134V146M44 140H56" opacity="0.12"/>
  </g>

  <!-- Accent Focal Point -->
  <circle cx="50" cy="50" r="2.5" fill="#C4A35A" opacity="0.6"/>
</svg>
