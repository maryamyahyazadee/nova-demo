<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" fill="none">
  <!-- Composite Technical Arcs & Reticle Guidelines (Origin at 0,0) -->
  <g stroke="#09707D">
    <!-- Solid Inner Arc -->
    <path d="M0 65 A 65 65 0 0 1 65 0" stroke-width="1.2" opacity="0.25"/>
    <!-- Dashed Middle Arc -->
    <path d="M0 115 A 115 115 0 0 1 115 0" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.22"/>
    <!-- Double Outer Hairline -->
    <path d="M0 168 A 168 168 0 0 1 168 0" stroke-width="1" opacity="0.16"/>
    <path d="M0 174 A 174 174 0 0 1 174 0" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.12"/>
    <!-- Wide Faint Boundary Arc -->
    <path d="M0 215 A 215 215 0 0 1 215 0" stroke-width="1" opacity="0.08"/>

    <!-- Radial Degree Rays -->
    <line x1="0" y1="0" x2="160" y2="92" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.15"/>
    <line x1="0" y1="0" x2="125" y2="125" stroke-width="1" stroke-dasharray="3 4" opacity="0.18"/>
    <line x1="0" y1="0" x2="92" y2="160" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.15"/>
  </g>

  <!-- Orbital Indicator Nodes -->
  <circle cx="81.3" cy="81.3" r="2.5" fill="#C4A35A" opacity="0.75"/>
  <circle cx="115" cy="0" r="2" fill="#09707D" opacity="0.3"/>
  <circle cx="0" cy="115" r="2" fill="#09707D" opacity="0.3"/>
</svg>
